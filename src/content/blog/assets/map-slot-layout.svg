<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>

  <!-- Swiss -->
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#222">Go 1.24 Swiss Table：key 与 value 同在一个槽位，value 为 struct{} 也要补齐</text>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="20"  y="45" width="80"  height="60" fill="#e5e7eb"/><text x="60" y="72" stroke="none" fill="#222">控制字</text><text x="60" y="92" stroke="none" fill="#666" font-size="11">8 B</text>
    <rect x="110" y="45" width="160" height="60" fill="#d6eaf8"/><text x="190" y="72" stroke="none" fill="#222">槽位 0 · key</text><text x="190" y="92" stroke="none" fill="#666" font-size="11">string 16 B</text>
    <rect x="270" y="45" width="80"  height="60" fill="#eeeeee" stroke-dasharray="4 3"/><text x="310" y="72" stroke="none" fill="#222">填充</text><text x="310" y="92" stroke="none" fill="#666" font-size="11">8 B</text>
    <rect x="360" y="45" width="160" height="60" fill="#d6eaf8"/><text x="440" y="72" stroke="none" fill="#222">槽位 1 · key</text><text x="440" y="92" stroke="none" fill="#666" font-size="11">string 16 B</text>
    <rect x="520" y="45" width="80"  height="60" fill="#eeeeee" stroke-dasharray="4 3"/><text x="560" y="72" stroke="none" fill="#222">填充</text><text x="560" y="92" stroke="none" fill="#666" font-size="11">8 B</text>
    <rect x="610" y="45" width="100" height="60" fill="#ffffff" stroke-dasharray="2 4"/><text x="660" y="80" stroke="none" fill="#555">… 槽位 2–7</text>
  </g>
  <!-- slot bracket -->
  <path d="M110 118 v8 h240 v-8" fill="none" stroke="#2874a6"/>
  <text x="230" y="144" font-size="12" text-anchor="middle" fill="#2874a6">一个槽位 = 24 B</text>
  <path d="M360 118 v8 h240 v-8" fill="none" stroke="#2874a6"/>
  <text x="480" y="144" font-size="12" text-anchor="middle" fill="#2874a6">一个槽位 = 24 B</text>

  <line x1="20" y1="170" x2="880" y2="170" stroke="#ddd"/>

  <!-- Old -->
  <text x="20" y="200" font-size="15" font-weight="bold" fill="#222">Go 1.23 旧实现：8 个 key 连续、8 个 value 连续（桶内，示意宽度不按比例）</text>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="20"  y="217" width="90"  height="60" fill="#e5e7eb"/><text x="65" y="244" stroke="none" fill="#222">tophash</text><text x="65" y="264" stroke="none" fill="#666" font-size="11">8 B</text>
    <rect x="110" y="217" width="400" height="60" fill="#d6eaf8"/><text x="310" y="244" stroke="none" fill="#222">key0 key1 key2 … key7</text><text x="310" y="264" stroke="none" fill="#666" font-size="11">8 × 16 = 128 B</text>
    <rect x="510" y="217" width="8"   height="60" fill="#f5b7b1"/>
    <rect x="518" y="217" width="90"  height="60" fill="#e5e7eb"/><text x="563" y="244" stroke="none" fill="#222">overflow</text><text x="563" y="264" stroke="none" fill="#666" font-size="11">指针 8 B</text>
  </g>
  <text x="514" y="300" font-size="12" text-anchor="middle" fill="#c0392b">values 段：struct{} × 8 = 0 B</text>
  <path d="M514 292 v-12" stroke="#c0392b"/>
</svg>
