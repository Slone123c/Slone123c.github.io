<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">Go 1.24 map 的四层结构：directory → table → group → slot</text>

  <!-- directory -->
  <text x="20" y="56" font-size="13" fill="#555">directory（数组，按哈希高位选 table；多个目录项可指向同一张 table）</text>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="20"  y="66" width="70" height="40" fill="#fdebd0"/><text x="55"  y="91" stroke="none" fill="#222">[0]</text>
    <rect x="90"  y="66" width="70" height="40" fill="#fdebd0"/><text x="125" y="91" stroke="none" fill="#222">[1]</text>
    <rect x="160" y="66" width="70" height="40" fill="#fdebd0"/><text x="195" y="91" stroke="none" fill="#222">[2]</text>
    <rect x="230" y="66" width="70" height="40" fill="#fdebd0"/><text x="265" y="91" stroke="none" fill="#222">[3]</text>
  </g>
  <g stroke="#555" marker-end="url(#a)">
    <line x1="55"  y1="106" x2="55"  y2="150"/>
    <line x1="125" y1="106" x2="125" y2="150"/>
    <line x1="195" y1="106" x2="660" y2="150"/>
    <line x1="265" y1="106" x2="760" y2="150"/>
  </g>

  <!-- table A -->
  <rect x="20" y="152" width="560" height="90" fill="#f4f9fd" stroke="#2874a6"/>
  <text x="32" y="172" font-size="13" font-weight="bold" fill="#2874a6">table A：一张开放寻址哈希表，最多 1024 槽位 = 128 个 group</text>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="35"  y="188" width="60" height="42" fill="#d6eaf8"/><text x="65"  y="214" stroke="none" fill="#222">group 0</text>
    <rect x="105" y="188" width="60" height="42" fill="#ffffff"/><text x="135" y="214" stroke="none" fill="#222">group 1</text>
    <rect x="175" y="188" width="60" height="42" fill="#ffffff"/><text x="205" y="214" stroke="none" fill="#222">group 2</text>
    <rect x="245" y="188" width="60" height="42" fill="#ffffff" stroke-dasharray="2 4"/><text x="275" y="214" stroke="none" fill="#222">…</text>
    <rect x="315" y="188" width="70" height="42" fill="#ffffff"/><text x="350" y="214" stroke="none" fill="#222">group 127</text>
  </g>

  <!-- table B -->
  <rect x="620" y="152" width="260" height="90" fill="#f7f7f7" stroke="#999" stroke-dasharray="5 4"/>
  <text x="750" y="190" font-size="13" text-anchor="middle" fill="#555">table B</text>
  <text x="750" y="212" font-size="12" text-anchor="middle" fill="#777">结构与 table A 相同，独立扩容</text>

  <!-- zoom group 0 -->
  <g stroke="#999" stroke-dasharray="4 3">
    <line x1="35"  y1="230" x2="20"  y2="290"/>
    <line x1="95"  y1="230" x2="868" y2="290"/>
  </g>
  <text x="20" y="282" font-size="12" fill="#555">放大 group 0：8 字节控制字 + 8 个槽位</text>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="20"  y="292" width="80" height="56" fill="#e5e7eb"/><text x="60" y="316" stroke="none" fill="#222">控制字</text><text x="60" y="334" stroke="none" fill="#666" font-size="11">8 B</text>
    <rect x="100" y="292" width="96" height="56" fill="#fde2e2"/><text x="148" y="326" stroke="none" fill="#222">槽位 0</text>
    <rect x="196" y="292" width="96" height="56" fill="#ffffff"/><text x="244" y="326" stroke="none" fill="#222">槽位 1</text>
    <rect x="292" y="292" width="96" height="56" fill="#ffffff"/><text x="340" y="326" stroke="none" fill="#222">槽位 2</text>
    <rect x="388" y="292" width="96" height="56" fill="#ffffff"/><text x="436" y="326" stroke="none" fill="#222">槽位 3</text>
    <rect x="484" y="292" width="96" height="56" fill="#ffffff"/><text x="532" y="326" stroke="none" fill="#222">槽位 4</text>
    <rect x="580" y="292" width="96" height="56" fill="#ffffff"/><text x="628" y="326" stroke="none" fill="#222">槽位 5</text>
    <rect x="676" y="292" width="96" height="56" fill="#ffffff"/><text x="724" y="326" stroke="none" fill="#222">槽位 6</text>
    <rect x="772" y="292" width="96" height="56" fill="#ffffff"/><text x="820" y="326" stroke="none" fill="#222">槽位 7</text>
  </g>

  <!-- zoom slot 0 -->
  <g stroke="#999" stroke-dasharray="4 3">
    <line x1="100" y1="348" x2="100" y2="394"/>
    <line x1="196" y1="348" x2="868" y2="394"/>
  </g>
  <text x="100" y="384" font-size="12" fill="#555" text-anchor="start">放大槽位 0：key 与 value 紧挨着存放</text>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="100" y="396" width="450" height="46" fill="#fde2e2"/><text x="325" y="424" stroke="none" fill="#222">key</text>
    <rect x="550" y="396" width="318" height="46" fill="#d5f5e3"/><text x="709" y="424" stroke="none" fill="#222">value（再按对齐补填充）</text>
  </g>
  <text x="20" y="468" font-size="12" fill="#777">元素 ≤ 8 的小 map：只分配一个 group，没有 directory 和 table。</text>
</svg>
