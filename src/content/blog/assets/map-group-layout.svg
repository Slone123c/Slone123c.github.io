<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 330" width="890" height="330" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="890" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">一个 group 的内存布局（map[string]struct{}：8 + 8×24 = 200 字节）</text>

  <!-- section labels -->
  <text x="180" y="62" font-size="13" text-anchor="middle" fill="#555">控制字（8 字节，每槽位 1 字节）</text>
  <text x="606" y="62" font-size="13" text-anchor="middle" fill="#555">8 个槽位（每个 24 字节）</text>
  <line x1="20" y1="70" x2="340" y2="70" stroke="#999"/>
  <line x1="350" y1="70" x2="862" y2="70" stroke="#999"/>

  <!-- control cells -->
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="20"  y="80" width="40" height="60" fill="#fde2e2"/><text x="40"  y="116" stroke="none" fill="#222">c0</text>
    <rect x="60"  y="80" width="40" height="60" fill="#fdebd0"/><text x="80"  y="116" stroke="none" fill="#222">c1</text>
    <rect x="100" y="80" width="40" height="60" fill="#fcf3cf"/><text x="120" y="116" stroke="none" fill="#222">c2</text>
    <rect x="140" y="80" width="40" height="60" fill="#d5f5e3"/><text x="160" y="116" stroke="none" fill="#222">c3</text>
    <rect x="180" y="80" width="40" height="60" fill="#d0ece7"/><text x="200" y="116" stroke="none" fill="#222">c4</text>
    <rect x="220" y="80" width="40" height="60" fill="#d6eaf8"/><text x="240" y="116" stroke="none" fill="#222">c5</text>
    <rect x="260" y="80" width="40" height="60" fill="#e8daef"/><text x="280" y="116" stroke="none" fill="#222">c6</text>
    <rect x="300" y="80" width="40" height="60" fill="#f5d5e8"/><text x="320" y="116" stroke="none" fill="#222">c7</text>
  </g>

  <!-- slots -->
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="350" y="80" width="64" height="60" fill="#fde2e2"/><text x="382" y="106" stroke="none" fill="#222">槽位 0</text><text x="382" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="414" y="80" width="64" height="60" fill="#fdebd0"/><text x="446" y="106" stroke="none" fill="#222">槽位 1</text><text x="446" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="478" y="80" width="64" height="60" fill="#fcf3cf"/><text x="510" y="106" stroke="none" fill="#222">槽位 2</text><text x="510" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="542" y="80" width="64" height="60" fill="#d5f5e3"/><text x="574" y="106" stroke="none" fill="#222">槽位 3</text><text x="574" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="606" y="80" width="64" height="60" fill="#d0ece7"/><text x="638" y="106" stroke="none" fill="#222">槽位 4</text><text x="638" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="670" y="80" width="64" height="60" fill="#d6eaf8"/><text x="702" y="106" stroke="none" fill="#222">槽位 5</text><text x="702" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="734" y="80" width="64" height="60" fill="#e8daef"/><text x="766" y="106" stroke="none" fill="#222">槽位 6</text><text x="766" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
    <rect x="798" y="80" width="64" height="60" fill="#f5d5e8"/><text x="830" y="106" stroke="none" fill="#222">槽位 7</text><text x="830" y="126" stroke="none" fill="#666" font-size="11">24 B</text>
  </g>
  <text x="185" y="162" font-size="12" text-anchor="middle" fill="#777">同色表示：c_i 描述槽位 i 的状态</text>

  <!-- zoom into slot 0 -->
  <g stroke="#999" stroke-dasharray="4 3">
    <line x1="350" y1="140" x2="350" y2="215"/>
    <line x1="414" y1="140" x2="862" y2="215"/>
  </g>
  <g stroke="#555" font-size="13" text-anchor="middle">
    <rect x="350" y="215" width="341" height="50" fill="#fde2e2"/><text x="520" y="245" stroke="none" fill="#222">key：string（16 B）</text>
    <rect x="691" y="215" width="171" height="50" fill="#eeeeee"/><text x="776" y="245" stroke="none" fill="#222">填充（8 B）</text>
  </g>
  <text x="606" y="288" font-size="12" text-anchor="middle" fill="#777">放大槽位 0：value 是 struct{}（0 B），但末尾零大小字段仍会被补齐 8 B</text>

  <!-- control byte legend -->
  <g font-size="13" fill="#222">
    <text x="20" y="200" font-weight="bold">控制字节取值</text>
    <text x="20" y="224" font-family="Menlo, monospace">0xxxxxxx</text><text x="110" y="224">已占用，低 7 位 = H2</text>
    <text x="20" y="248" font-family="Menlo, monospace">10000000</text><text x="110" y="248">空（empty）</text>
    <text x="20" y="272" font-family="Menlo, monospace">11111110</text><text x="110" y="272">已删除（deleted）</text>
  </g>
</svg>
