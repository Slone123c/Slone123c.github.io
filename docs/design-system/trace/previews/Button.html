<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="tr-pad"></div>
<script>
  var T = window.Trace, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'tr-row'},
  h(T.Button,{variant:'primary'},'开始单步演示 →'),
  h(T.Button,null,'阅读全文'),
  h(T.Button,{variant:'ghost'},'← 上一步'),
  h(T.Button,{size:'sm'},'复制代码'),
  h(T.Button,{disabled:true},'已是最后一步'))
  );
</script>
</body>
</html>
