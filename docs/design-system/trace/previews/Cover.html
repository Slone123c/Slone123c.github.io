<!doctype html>
<html lang="zh-CN">
<head>

<title>Trace</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .ink { fill:var(--ink); }
  .signal { fill:var(--signal); }
  .mark { fill:var(--mark); }
  .cobalt { fill:var(--cobalt); }
  .dot { fill:var(--line-strong); }
  .blk { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.9; font-weight:750; letter-spacing:-0.04em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
