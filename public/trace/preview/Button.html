<!doctype html>
<html lang="zh-CN">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.js"></script><script src="../assets/react-dom.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="tr-pad"></div>
<script>
  var T = window.Trace, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'tr-row'},
  h(T.Button,{variant:'primary'},'开始单步演示 →'),
  h(T.Button,null,'阅读全文'),
  h(T.Button,{variant:'ghost'},'← 上一步'),
  h(T.Button,{size:'sm'},'复制代码'),
  h(T.Button,{disabled:true},'已是最后一步'))
  );
</script>
</body>
</html>
