<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/bundle.css"><script src="../assets/react.js"></script><script src="../assets/react-dom.js"></script><script src="../assets/bundle.js"></script><meta charset="utf-8"><title>ProfilePage — showcase</title>
<style>
  .pf { max-width: 1040px; margin: 0 auto; padding: 0 var(--space-6) var(--space-8); }
  .pf a { color: inherit; }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; background: var(--bg); border-bottom: 1.5px solid var(--line); }
  .who { font-family: var(--font-display); font-size: 20px; font-weight: 750; letter-spacing: -0.02em; }
  .who i { font-style: normal; display: inline-block; width: 10px; height: 10px; background: var(--signal); border-radius: 2px; margin-right: 8px; }
  .seg { display: inline-flex; padding: 3px; border-radius: var(--radius-full); background: var(--surface-sunken); font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .seg button { font: inherit; border: 0; background: transparent; color: var(--ink-muted); padding: 4px 12px; border-radius: var(--radius-full); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .seg button:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }

  /* 01 hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-7); align-items: center; padding: var(--space-8) 0 var(--space-7); }
  .status { display: inline-flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 2px 10px 2px 8px; border-radius: var(--radius-full); background: var(--signal-soft); color: var(--signal-text); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); }
  .hero h1 { margin: var(--space-4) 0 var(--space-3); font-family: var(--font-display); font-size: 60px; line-height: 64px; font-weight: 750; letter-spacing: -0.035em; }
  .hero .role { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: var(--space-4); }
  .hero .role span { color: var(--ink-subtle); margin: 0 6px; }
  .hero p.pitch { margin: 0 0 var(--space-5); font-size: 19px; line-height: 32px; color: var(--ink-muted); max-width: 540px; }
  .hero p.pitch mark { background: var(--mark-soft); color: var(--ink); box-shadow: inset 0 -3px 0 var(--mark); padding: 0 2px; }
  .links { display: flex; gap: var(--space-4); margin-top: var(--space-4); font-family: var(--font-mono); font-size: 13px; }
  .links a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

  /* grid sections (02–07) */
  .sec { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--space-5); margin-top: var(--space-8); }
  .sec-h { grid-column: 1 / span 3; border-top: 3px solid var(--ink); padding-top: var(--space-3); }
  .sec-h .n { font-family: var(--font-display); font-size: 44px; line-height: 44px; font-weight: 750; letter-spacing: -0.04em; }
  .sec-h h2 { margin: var(--space-2) 0 var(--space-1); font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 700; }
  .sec-h p { margin: 0; font-size: 13px; line-height: 20px; color: var(--ink-muted); }
  .sec-b { grid-column: 4 / -1; border-top: 1px solid var(--line); padding-top: var(--space-4); min-width: 0; }

  /* 02 skills */
  .skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
  .lvl { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
  .lvl i { display: inline-flex; gap: 2px; } .lvl i b { width: 10px; height: 6px; border-radius: 2px; background: var(--line); } .lvl i b.on { background: var(--ink); }
  .skill { padding: var(--space-3) 0; border-top: 1px solid var(--line); }
  .skill strong { display: block; font-size: 15px; line-height: 22px; }
  .skill a { display: inline-block; margin-top: 2px; font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--link); text-decoration: none; }
  .skill a:hover { text-decoration: underline; }
  .skill .none { font-family: var(--font-mono); font-size: 12px; color: var(--ink-subtle); }

  /* 03 projects */
  .proj { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-md); padding: var(--space-5); margin-bottom: var(--space-5); }
  .proj-top { display: flex; justify-content: space-between; gap: var(--space-4); align-items: baseline; flex-wrap: wrap; }
  .proj h3 { margin: var(--space-2) 0 var(--space-3); font-family: var(--font-display); font-size: 22px; line-height: 30px; font-weight: 700; }
  .proj .meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-subtle); }
  .psr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin: var(--space-4) 0; }
  .psr div b { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink-subtle); margin-bottom: var(--space-1); }
  .psr div { font-size: 14px; line-height: 23px; }
  .proj .more { margin-top: var(--space-4); }
  .proj-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); }
  .proj-row .proj { margin: 0; }
  .proj-row .proj h3 { font-size: 19px; line-height: 26px; }

  /* 04 timeline */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--space-5); padding: var(--space-4) 0; border-top: 1px solid var(--line); }
  .tl li:first-child { border-top: 0; padding-top: 0; }
  .tl .d { font-family: var(--font-mono); font-size: 13px; line-height: 22px; color: var(--ink-subtle); }
  .tl .d b { color: var(--ink); font-weight: 700; }
  .tl h4 { margin: 0; font-size: 16px; line-height: 24px; }
  .tl h4 span { font-weight: 400; color: var(--ink-muted); }
  .tl p { margin: var(--space-1) 0 0; font-size: 14px; line-height: 23px; color: var(--ink-muted); }

  /* 05 writing */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
  .learning { margin-top: var(--space-5); display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--surface-sunken); font-size: 14px; }
  .learning b { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-subtle); white-space: nowrap; }
  .prog { flex: 1; display: flex; gap: 3px; min-width: 120px; } .prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); } .prog i.on { background: var(--ink); } .prog i.now { background: var(--signal); }
  .learning span.c { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); white-space: nowrap; }

  /* 06 how I work */
  .ways { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }

  /* 07 contact */
  .contact { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
  .contact div b { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--ink-subtle); margin-bottom: var(--space-1); }
  .contact div { font-size: 15px; line-height: 24px; }
  .contact a { color: var(--link); }
  .aside { margin-top: var(--space-5); font-size: 14px; color: var(--ink-muted); }

  .quick .full-only { display: none; }

  @media (max-width: 760px) {
    .hero, .skills, .psr, .proj-row, .cards, .ways, .contact { grid-template-columns: 1fr; }
    .sec-h, .sec-b { grid-column: 1 / -1; } .sec-b { border-top: 0; }
    .hero h1 { font-size: 44px; line-height: 48px; }
    .tl li { grid-template-columns: 1fr; gap: var(--space-1); }
  }
  /* print = a one-file resume */
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    .bar .seg, .noprint, .tr-btn { display: none !important; }
    .bar { position: static; }
    .pf { padding: 0; }
    .hero { padding: 16px 0; gap: 24px; }
    .sec { margin-top: 24px; break-inside: avoid; }
    .proj { break-inside: avoid; }
  }

      /* 02 skills */

        h('div', { className: 'skills' }, SKILLS.map(function (col) {

            col.items.map(function (s) {
              return h('div', { key: s.k, className: 'skill' }, h('strong', null, s.k),
                s.proof ? h('a', { href: '#' }, s.proof) : h('span', { className: 'none' }, '学习中，暂无公开作品'));
            }));

      /* 03 projects */
      h(Sec, { n: '03', title: '精选项目', hint: '问题 → 方案 → 结果。内部名称已抽象，数字为量级。', id: 'work' },
        h('article', { className: 'proj' },
